name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    permissions:
      contents: read

  create-release:
    name: Create Release 🛰️
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v6

      - name: Collect Release Files 🏷️
        run: |
          : Collect Release Files 🏷️
          shopt -s nullglob

          commit_hash="${GITHUB_SHA:0:9}"
          for candidate in *-windows-x64-${commit_hash}/*.zip; do
            mv "${candidate}" "${GITHUB_WORKSPACE}"
          done

          release_files=("${GITHUB_WORKSPACE}"/*.zip)
          if (( ${#release_files[@]} == 0 )); then
            echo "::error::The Windows build did not produce a release ZIP."
            exit 1
          fi

      - name: Generate Checksums 🪪
        run: |
          : Generate Checksums 🪪
          echo '### Checksums' > "${GITHUB_WORKSPACE}/CHECKSUMS.txt"
          for file in "${GITHUB_WORKSPACE}"/*.zip; do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d ' ' -f 1)" >> "${GITHUB_WORKSPACE}/CHECKSUMS.txt"
          done

      - name: Create Draft Release 🛰️
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(needs.build-project.outputs.prerelease) }}
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ github.ref_name }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: ${{ github.workspace }}/*.zip
