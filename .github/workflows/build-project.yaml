name: Build Project
on:
  workflow_call:
    outputs:
      pluginName:
        description: Project display name detected from buildspec.json
        value: ${{ jobs.check-event.outputs.pluginName }}
      pluginVersion:
        description: Project version detected from buildspec.json
        value: ${{ jobs.check-event.outputs.pluginVersion }}
      prerelease:
        description: Whether the pushed version tag denotes a prerelease
        value: ${{ jobs.check-event.outputs.prerelease }}

jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
      prerelease: ${{ steps.setup.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Check Event Data ☑️
        id: setup
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          plugin_display_name="$(jq -r '.displayName // .name' buildspec.json)"
          plugin_version="$(jq -r '.version' buildspec.json)"
          config='RelWithDebInfo'
          prerelease='false'

          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-(beta|rc)[0-9]+)?$ ]]; then
              tag_version="${BASH_REMATCH[1]}"
              tag_suffix="${BASH_REMATCH[2]}"
            else
              echo "::error::Release tags must use vMAJOR.MINOR.PATCH, optionally followed by -betaN or -rcN."
              exit 1
            fi

            if [[ "${tag_version}" != "${plugin_version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match buildspec.json version ${plugin_version}."
              exit 1
            fi

            config='Release'
            if [[ -n "${tag_suffix}" ]]; then
              prerelease='true'
            fi
          fi

          echo "config=${config}" >> "$GITHUB_OUTPUT"
          echo "commitHash=${GITHUB_SHA:0:9}" >> "$GITHUB_OUTPUT"
          echo "pluginName=${plugin_display_name}" >> "$GITHUB_OUTPUT"
          echo "pluginVersion=${plugin_version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginName=$($BuildSpec.name)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: true

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*
